name: ssvvostc
description: "Premium LMS/ERP Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  flutter_dotenv: ^5.2.1
  dio: ^5.7.0
  get_storage: ^2.1.1
  flutter_svg: ^2.0.10+1
  video_player: ^2.9.2
  chewie: ^1.8.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.4
  pdfrx: ^2.2.24
  permission_handler: ^12.0.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#17212C"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  web:
    generate: false
